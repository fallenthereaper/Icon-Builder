name: Windows Native Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build and test Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install stable Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64
      - name: Build optimized Windows executable
        run: cargo build --release --target x86_64-pc-windows-msvc
      - name: Run Windows unit tests
        run: cargo test --release --target x86_64-pc-windows-msvc
      - name: Stage Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/iconforgeapp.exe dist/IconForge-Windows-x64.exe
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: IconForge-Windows-x64
          path: dist/IconForge-Windows-x64.exe
          if-no-files-found: error

  publish-windows-release:
    name: Publish Windows release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: IconForge-Windows-x64
          path: release-artifacts
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: "IconForge Windows ${{ github.ref_name }}"
          body: |
            Windows x64 native Rust release.
            Built with Rust, egui/eframe and Fastframe. No browser runtime.
          files: release-artifacts/IconForge-Windows-x64.exe
