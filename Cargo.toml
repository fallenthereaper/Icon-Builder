[package]
name = "iconforgeapp"
version = "1.1.0"
edition = "2024"
authors = ["Native Studio"]
description = "Windows-native liquid glass icon studio"

[dependencies]
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence"] }
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
fastframe-text  = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
fastframe-theme = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
fastframe-icons = { git = "https://github.com/crmne/fastframe", tag = "v0.15.5" }
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "webp"] }
ico = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
rfd = "0.15"
tiny-skia = "0.11"
resvg = "0.45.1"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
